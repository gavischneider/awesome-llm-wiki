# Dependabot opens pull requests when dependencies have updates. Each pull
# request runs the same checks as any other, so an update that breaks the site
# or the lint is visible before merging.
#
# Minor and patch updates are grouped into one pull request per area to keep
# the noise down; major versions come separately because they may need changes.
version: 2
updates:
  # The website (Astro, search, image tools, linters).
  - package-ecosystem: npm
    directory: /site
    schedule:
      interval: weekly
      day: monday
    groups:
      site-minor-and-patch:
        update-types: [minor, patch]
    ignore:
      # TypeScript major versions wait until the tools that depend on it
      # (@astrojs/check, typescript-eslint) support them; before that the
      # update cannot be resolved and Dependabot's run fails. Remove this
      # entry to try the next major.
      - dependency-name: typescript
        update-types: ['version-update:semver-major']

  # The repository root (awesome-lint).
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: monthly

  # Actions used by the workflows in .github/workflows/.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    groups:
      actions:
        patterns: ['*']
